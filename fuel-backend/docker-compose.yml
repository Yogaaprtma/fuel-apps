services:
  # PHP / Laravel App
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: fuel-fds-app
    container_name: fuel-fds-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - fuel-network
    depends_on:
      - db
      - redis

  # Database
  db:
    image: mysql:8.0
    container_name: fuel-fds-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - fuel-network

  # Redis (untuk WebSockets & Cache)
  redis:
    image: redis:alpine
    container_name: fuel-fds-redis
    restart: unless-stopped
    networks:
      - fuel-network

  # Queue Worker
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fuel-fds-worker
    restart: unless-stopped
    command: php artisan queue:work
    volumes:
      - ./:/var/www
    networks:
      - fuel-network
    depends_on:
      - db
      - redis

  # MinIO (Local S3 Storage)
  minio:
    image: minio/minio
    container_name: fuel-fds-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: sail
      MINIO_ROOT_PASSWORD: password
    command: minio server /data --console-address ":9001"
    networks:
      - fuel-network

  # MinIO MC (for creating bucket automatically)
  minio-mc:
    image: minio/mc
    container_name: fuel-fds-minio-mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 sail password;
      /usr/bin/mc mb myminio/local;
      /usr/bin/mc policy set public myminio/local;
      exit 0;
      "
    networks:
      - fuel-network

networks:
  fuel-network:
    driver: bridge

volumes:
  dbdata:
  minio_data:
