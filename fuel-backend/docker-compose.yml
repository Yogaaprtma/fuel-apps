services:
  # PHP / Laravel App
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: fuel-fds-app
    container_name: fuel-fds-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - fuel-network
    depends_on:
      - db
      - redis

  # Database
  db:
    image: mysql:8.0
    container_name: fuel-fds-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - fuel-network

  # Redis (untuk WebSockets & Cache)
  redis:
    image: redis:alpine
    container_name: fuel-fds-redis
    restart: unless-stopped
    networks:
      - fuel-network

  # Queue Worker
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fuel-fds-worker
    restart: unless-stopped
    command: php artisan queue:work
    volumes:
      - ./:/var/www
    networks:
      - fuel-network
    depends_on:
      - db
      - redis

networks:
  fuel-network:
    driver: bridge

volumes:
  dbdata:
