apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: app
        image: fuel-fds-app:latest
        imagePullPolicy: Never # if using minikube
        ports:
        - containerPort: 80
        env:
        - name: DB_HOST
          value: "mysql"
        - name: REDIS_HOST
          value: "redis"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: LoadBalancer
  ports:
  - port: 8000
    targetPort: 80
  selector:
    app: backend
